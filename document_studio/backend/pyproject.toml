[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-studio"
version = "0.1.0"
description = "Standalone document-processing backend for Document Studio."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
